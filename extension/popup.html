<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <img class="mark" src="assets/mark.png" alt="" />
        <div class="txt">
          <span class="eyebrow">AWS STS Keys</span>
          <h1 id="captured">No session captured</h1>
        </div>
      </div>
      <button id="clear" class="ghost" hidden>Clear</button>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <div id="tools" class="tools" hidden>
      <input
        id="filter"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Filter by account or role"
        aria-label="Filter accounts and roles"
      />
    </div>

    <main id="body"></main>

    <!-- One collapsed group per AWS account. -->
    <template id="tpl-account">
      <section class="acct">
        <button class="acct-head" type="button" aria-expanded="false">
          <span class="chev" aria-hidden="true"></span>
          <span class="acct-id"></span>
          <span class="acct-count"></span>
        </button>
        <div class="acct-roles" hidden></div>
      </section>
    </template>

    <!-- One row per role. Credentials are not requested until it is clicked. -->
    <template id="tpl-role">
      <div class="role-row">
        <button class="role-btn" type="button" aria-expanded="false">
          <span class="role-name"></span>
          <span class="role-state"></span>
        </button>
        <div class="role-body" hidden></div>
      </div>
    </template>

    <!-- The credential view, rendered into a role row only after minting. -->
    <template id="tpl-creds">
      <div class="creds">
        <div class="life">
          <div class="track"><div class="fill"></div></div>
          <span class="remaining"></span>
        </div>

        <dl class="fields">
          <div class="field">
            <dt>Access key ID</dt>
            <dd><code data-k="accessKeyId"></code>
              <button class="copy" data-copy="accessKeyId" aria-label="Copy access key ID">Copy</button>
            </dd>
          </div>
          <div class="field">
            <dt>Secret access key</dt>
            <dd><code data-k="secretAccessKey" data-masked="true"></code>
              <button class="reveal" aria-label="Reveal secret access key">Show</button>
              <button class="copy" data-copy="secretAccessKey" aria-label="Copy secret access key">Copy</button>
            </dd>
          </div>
          <div class="field">
            <dt>Session token</dt>
            <dd><code class="tok" data-k="sessionToken"></code>
              <button class="copy" data-copy="sessionToken" aria-label="Copy session token">Copy</button>
            </dd>
          </div>
        </dl>

        <div class="actions">
          <button class="solid" data-copy="env">Copy shell exports</button>
          <button class="solid alt" data-copy="profile">Copy profile block</button>
          <button class="solid alt switch">Switch role</button>
        </div>
      </div>
    </template>

    <!-- Switch role view: generates ~/.aws/config blocks that chain off an issued jump role. -->
    <template id="tpl-clients">
      <div class="clients">
        <button type="button" class="ghost back">← Back</button>
        <dl class="src">
          <div><dt>Source profile</dt><dd><code class="src-name"></code></dd></div>
          <div><dt>Session name</dt><dd><code class="src-session"></code></dd></div>
        </dl>
        <div id="crows"></div>
        <button type="button" class="ghost" id="add-row">+ Add client</button>
        <pre id="preview" class="preview"></pre>
        <div class="actions">
          <button class="solid" id="copy-config">Copy config block</button>
        </div>
        <p class="note">
          Paste into ~/.aws/config once. Keep this role's credentials in
          ~/.aws/credentials with "Copy profile block" as usual.
        </p>
      </div>
    </template>

    <!-- One client account row in the client profiles view. -->
    <template id="tpl-client-row">
      <fieldset class="crow">
        <div class="crow-grid">
          <label><span class="lbl">Profile name</span>
            <input data-f="name" placeholder="client-acme" autocomplete="off" spellcheck="false" /></label>
          <label><span class="lbl">Account ID</span>
            <input data-f="accountId" placeholder="111122223333" inputmode="numeric" maxlength="12" autocomplete="off" spellcheck="false" /></label>
          <label><span class="lbl">Role name</span>
            <input data-f="roleName" placeholder="DevOpsAccess" autocomplete="off" spellcheck="false" /></label>
          <label><span class="lbl">Region</span>
            <input data-f="region" placeholder="ap-south-1" autocomplete="off" spellcheck="false" /></label>
        </div>
        <p class="crow-err" role="alert" hidden></p>
        <button type="button" class="ghost remove">Remove</button>
      </fieldset>
    </template>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
